services:
  postgres-db:
    image: postgres:17
    environment:
      POSTGRES_DB: medical_clinic
      POSTGRES_USER: medical_clinic
      POSTGRES_PASSWORD: medical_clinic
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U medical_clinic"]
      interval: 5s
      timeout: 5s
      retries: 10

  medical-clinic-app:
    image: medical-clinic
    container_name: medical-clinic-app
    depends_on:
      postgres-db:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres-db:5432/medical_clinic
      SPRING_DATASOURCE_USERNAME: medical_clinic
      SPRING_DATASOURCE_PASSWORD: medical_clinic
    ports:
      - "8080:8080"

volumes:
  postgres-data: