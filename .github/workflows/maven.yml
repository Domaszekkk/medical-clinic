name: Java CI with Maven
on:
  push:
    branches: [ "main", "feature/**" ]
  pull_request:
    branches: [ "main" ]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: maven
    - name: Grant execute permission for mvnw
      run: chmod +x mvnw
    - name: Build with Maven
      run: ./mvnw clean install -B

  security-check:
    name: Dependency Security Scan
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Run Trivy vulnerability scanner
      uses: aquasecurity/trivy-action@0.28.0
      with:
        scan-type: 'fs'
        scan-ref: '.'
        severity: 'CRITICAL,HIGH'
        exit-code: '0'

  sonarcloud:
    name: SonarCloud Analysis
    needs: build
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0
    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
    - name: Grant execute permission for mvnw
      run: chmod +x mvnw
    - name: Build and analyze
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      run: ./mvnw -B verify org.sonarsource.scanner.maven:sonar-maven-plugin:sonar -Dsonar.projectKey=Domaszekkk_medical-clinic -Dsonar.organization=domaszekkk

  docker-build:
    name: Build Docker Image
    needs: build
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Build Docker image
      run: docker build -t medical-clinic:${{ github.sha }} .
    - name: Save Docker image as tarball
      run: docker save medical-clinic:${{ github.sha }} -o medical-clinic-image.tar
    - name: Upload image artifact
      uses: actions/upload-artifact@v4
      with:
        name: medical-clinic-image
        path: medical-clinic-image.tar
        retention-days: 1

  docker-sign:
    name: Sign Docker Image
    needs: docker-build
    runs-on: ubuntu-latest
    steps:
    - name: Download image artifact
      uses: actions/download-artifact@v4
      with:
        name: medical-clinic-image
    - name: Install Cosign
      uses: sigstore/cosign-installer@v3
    - name: Generate ephemeral key pair
      env:
        COSIGN_PASSWORD: ""
      run: cosign generate-key-pair
    - name: Sign the image tarball
      env:
        COSIGN_PASSWORD: ""
      run: cosign sign-blob --key cosign.key --yes --output-signature medical-clinic-image.tar.sig medical-clinic-image.tar
    - name: Verify the signature
      run: cosign verify-blob --key cosign.pub --signature medical-clinic-image.tar.sig medical-clinic-image.tar

  upload-artifact:
    name: Upload to Artifact Repository (simulated)
    needs: docker-sign
    runs-on: ubuntu-latest
    steps:
    - name: Simulate upload to central artifact repository
      run: |
        echo "Connecting to central artifact repository (e.g. Nexus/Artifactory)..."
        sleep 2
        echo "Uploading medical-clinic:${{ github.sha }} ..."
        sleep 2
        echo "Upload complete (simulated step - no real registry configured)"
