databaseChangeLog:
  - changeSet:
      id: 008-drop-email-password-from-doctors
      author: domaszekkk
      comment: "Removes email and password columns from doctors, now sourced from the linked user"
      changes:
        - dropColumn:
            tableName: doctors
            columns:
              - column:
                  name: email
              - column:
                  name: password
      rollback:
        - addColumn:
            tableName: doctors
            columns:
              - column:
                  name: email
                  type: VARCHAR(255)
              - column:
                  name: password
                  type: VARCHAR(255)