databaseChangeLog:
  - changeSet:
      id: 004-create-facilities-table
      author: domaszekkk
      comment: "Creates the facilities table"
      changes:
        - createTable:
            tableName: facilities
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    primaryKeyName: pk_facilities
                    nullable: false
              - column:
                  name: name
                  type: VARCHAR(255)
                  constraints:
                    unique: true
                    uniqueConstraintName: uq_facilities_name
              - column:
                  name: city
                  type: VARCHAR(255)
              - column:
                  name: zip_code
                  type: VARCHAR(255)
              - column:
                  name: street
                  type: VARCHAR(255)
              - column:
                  name: building_number
                  type: VARCHAR(255)
      rollback:
        - dropTable:
            tableName: facilities