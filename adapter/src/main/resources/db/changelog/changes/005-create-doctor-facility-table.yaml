databaseChangeLog:
  - changeSet:
      id: 005-create-doctor-facility-table
      author: domaszekkk
      comment: "Creates the join table for the many-to-many relationship between doctors and facilities"
      changes:
        - createTable:
            tableName: doctor_facility
            columns:
              - column:
                  name: doctor_id
                  type: BIGINT
                  constraints:
                    nullable: false
              - column:
                  name: facility_id
                  type: BIGINT
                  constraints:
                    nullable: false
        - addPrimaryKey:
            tableName: doctor_facility
            columnNames: doctor_id, facility_id
            constraintName: pk_doctor_facility
        - addForeignKeyConstraint:
            baseTableName: doctor_facility
            baseColumnNames: doctor_id
            referencedTableName: doctors
            referencedColumnNames: id
            constraintName: fk_doctor_facility_doctor_id
        - addForeignKeyConstraint:
            baseTableName: doctor_facility
            baseColumnNames: facility_id
            referencedTableName: facilities
            referencedColumnNames: id
            constraintName: fk_doctor_facility_facility_id
      rollback:
        - dropTable:
            tableName: doctor_facility