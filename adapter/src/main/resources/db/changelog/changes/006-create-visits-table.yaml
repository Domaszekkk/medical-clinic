databaseChangeLog:
  - changeSet:
      id: 006-create-visits-table
      author: domaszekkk
      comment: "Creates the visits table with foreign keys to doctors, patients and facilities"
      changes:
        - createTable:
            tableName: visits
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    primaryKeyName: pk_visits
                    nullable: false
              - column:
                  name: start_date_time
                  type: TIMESTAMP
              - column:
                  name: end_date_time
                  type: TIMESTAMP
              - column:
                  name: doctor_id
                  type: BIGINT
              - column:
                  name: patient_id
                  type: BIGINT
              - column:
                  name: facility_id
                  type: BIGINT
        - addForeignKeyConstraint:
            baseTableName: visits
            baseColumnNames: doctor_id
            referencedTableName: doctors
            referencedColumnNames: id
            constraintName: fk_visits_doctor_id
        - addForeignKeyConstraint:
            baseTableName: visits
            baseColumnNames: patient_id
            referencedTableName: patients
            referencedColumnNames: id
            constraintName: fk_visits_patient_id
        - addForeignKeyConstraint:
            baseTableName: visits
            baseColumnNames: facility_id
            referencedTableName: facilities
            referencedColumnNames: id
            constraintName: fk_visits_facility_id
      rollback:
        - dropTable:
            tableName: visits