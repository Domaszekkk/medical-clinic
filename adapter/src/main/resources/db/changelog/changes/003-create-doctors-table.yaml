databaseChangeLog:
  - changeSet:
      id: 003-create-doctors-table
      author: domaszekkk
      comment: "Creates the doctors table"
      changes:
        - createTable:
            tableName: doctors
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    primaryKeyName: pk_doctors
                    nullable: false
              - column:
                  name: email
                  type: VARCHAR(255)
              - column:
                  name: password
                  type: VARCHAR(255)
              - column:
                  name: first_name
                  type: VARCHAR(255)
              - column:
                  name: last_name
                  type: VARCHAR(255)
              - column:
                  name: specialization
                  type: VARCHAR(255)
      rollback:
        - dropTable:
            tableName: doctors