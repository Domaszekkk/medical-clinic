databaseChangeLog:
  - changeSet:
      id: 007-add-user-id-to-doctors
      author: domaszekkk
      comment: "Adds a foreign key to users on the doctors table"
      changes:
        - addColumn:
            tableName: doctors
            columns:
              - column:
                  name: user_id
                  type: BIGINT
        - addForeignKeyConstraint:
            baseTableName: doctors
            baseColumnNames: user_id
            referencedTableName: users
            referencedColumnNames: id
            constraintName: fk_doctors_user_id
      rollback:
        - dropForeignKeyConstraint:
            baseTableName: doctors
            constraintName: fk_doctors_user_id
        - dropColumn:
            tableName: doctors
            columnName: user_id